# HDDServer conf/nginx.conf for the ROP Registry (an installation dedicated to it).
# Based on HDDServer's presets/laravel/nginx.conf, without Reverb (the registry has none).
# The registry lives in {base}/sites/rop (not in root/: HDDServer writes health.php
# and starting.html there on every start, which would dirty the Git checkout).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type application/octet-stream;
    sendfile off;
    keepalive_timeout 65;
    # Backup archives uploaded on the Backups page grow with the attachments.
    client_max_body_size 2048M;
    client_body_timeout 600s;
    send_timeout 600s;

    server {
        # The only server block, so it answers for localhost, the PC's name and its LAN IP.
        listen 80;
        server_name localhost;
        root "{base}/sites/rop/public";
        index index.php;
        autoindex off;
        charset utf-8;

        error_page 502 503 504 /starting.html;

        location = /starting.html {
            root "{www}";
            internal;
            add_header Cache-Control "no-store" always;
        }

        # HDDServer probes these endpoints even when Laravel is in maintenance mode.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location = /health.php {
            allow 127.0.0.1;
            deny all;
            include        fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME "{www}/health.php";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Only Laravel's front controller is executable from the public directory.
        location = /index.php {
            try_files $uri =404;
            include        fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param HTTP_PROXY "";
            fastcgi_hide_header X-Powered-By;
            # Full backups and restores run inside the request.
            fastcgi_read_timeout 900s;
        }

        location ~ \.php(?:/|$) {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        error_log "../../logs/nginx/error.log";
        access_log "../../logs/nginx/access.log";
    }
}
